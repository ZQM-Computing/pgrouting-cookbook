site_name: pgRouting Cookbook
site_url: https://pgrouting.zqmlabs.com/
site_description: Runnable pgRouting and PostGIS examples for shortest paths, driving distance, isochrones, turn restrictions, and reproducible synthetic network analysis.
site_author: ZQM Computing
repo_url: https://github.com/ZQM-Computing/pgrouting-cookbook

theme:
  name: material
  custom_dir: docs/overrides
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
