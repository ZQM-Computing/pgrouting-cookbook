name: CI

"on":
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - '**.png'
      - '**.jpg'
      - '**.gif'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - '**.png'
      - '**.jpg'
      - '**.gif'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.detect.outputs.python }}
      node: ${{ steps.detect.outputs.node }}
      go: ${{ steps.detect.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: detect
        run: |
          if [ -f pyproject.toml ] || [ -f pytest.ini ] || [ -f requirements.txt ] || [ -d tests ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f package.json ]; then
            echo "node=true" >> "$GITHUB_OUTPUT"
          else
            echo "node=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f go.mod ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  python:
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -f pyproject.toml ] || [ -f setup.py ]; then python -m pip install -e .; fi
          python -m pip install pytest
          if find . -path './.git' -prune -o -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q .; then
            python -m pytest -q
          else
            echo "::error::No pytest-discoverable test files found; refusing a false-green CI run." >&2
            exit 1
          fi

  node:
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install and test
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          else
            echo "No npm test script configured; dependency installation completed."
          fi

  go:
    needs: detect
    if: needs.detect.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: Run tests
        run: go test ./...

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check repository documentation
        run: python scripts/check_docs.py

  sql-examples:
    runs-on: ubuntu-latest
    services:
      pgrouting:
        image: pgrouting/pgrouting:15-3.5-3.7.3
        env:
          POSTGRES_DB: gis
          POSTGRES_USER: gis
          POSTGRES_PASSWORD: gis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gis -d gis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Execute every SQL example against PostgreSQL, PostGIS, and pgRouting
        env:
          PGPASSWORD: gis
        run: |
          set -euo pipefail
          for example in examples/*/run.sql; do
            echo "::group::${example}"
            psql --host=127.0.0.1 --username=gis --dbname=gis --set=ON_ERROR_STOP=1 --file="${example}"
            echo "::endgroup::"
          done
