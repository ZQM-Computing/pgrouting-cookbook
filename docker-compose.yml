version: "3.8"
services:
  pgrouting:
    image: pgrouting/pgrouting:15-3.4-3.6.0
    environment:
      POSTGRES_DB: gis
      POSTGRES_USER: gis
      POSTGRES_PASSWORD: gis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./examples:/examples
    command: postgres -c shared_preload_libraries=pg_stat_statements

volumes:
  pgdata:
